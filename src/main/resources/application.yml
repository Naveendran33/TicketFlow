spring:
  application:
    name: ticketflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/book_here_db
    username: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true


app:
  jwt:
    secret: ${JWT_SECRET_KEY}
    expiration: 3600000
